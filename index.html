<title>ArtisanRescue — Marketplace des artisans</title>

<style>
:root{
  --indigo-950:#141b30;
  --indigo-900:#1b2a4a;
  --indigo-800:#243761;
  --indigo-700:#324a7d;
  --ochre:#e8a33d;
  --ochre-dim:#c98a2e;
  --terracotta:#c1502e;
  --kente:#3c7a5d;
  --kente-dim:#2e6049;
  --cream:#f5efe3;
  --cream-dim:#cfc6b3;
  --line:rgba(245,239,227,0.14);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--indigo-950);color:var(--cream);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--ochre);color:var(--indigo-950);}

/* wax-pattern divider — signature element */
.wax{
  height:10px;width:100%;
  background:
    repeating-linear-gradient(135deg, var(--ochre) 0 6px, transparent 6px 14px),
    repeating-linear-gradient(45deg, var(--terracotta) 0 6px, transparent 6px 14px);
  background-size:20px 10px,20px 10px;
  background-position:0 0, 0 0;
  opacity:0.9;
}

.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--indigo-950);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:0.2px;}
.logo-mark{
  width:38px;height:38px;border-radius:9px;
  background:conic-gradient(from 210deg, var(--ochre), var(--terracotta), var(--kente), var(--ochre));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:var(--indigo-950);font-size:14px;letter-spacing:-0.5px;
}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.navbtn{
  background:transparent;border:1px solid transparent;color:var(--cream-dim);
  padding:8px 14px;border-radius:20px;font-size:14px;font-weight:500;transition:.15s;
}
.navbtn:hover{color:var(--cream);}
.navbtn.active{background:var(--indigo-800);color:var(--ochre);border-color:var(--line);}

.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px;}
.hero{padding:56px 0 36px;}
.eyebrow{color:var(--ochre);text-transform:uppercase;letter-spacing:1.6px;font-size:12px;font-weight:600;margin-bottom:14px;}
.hero h1{font-size:44px;line-height:1.08;font-weight:600;margin:0 0 16px;max-width:720px;}
.hero p{color:var(--cream-dim);font-size:16px;max-width:560px;line-height:1.6;margin:0 0 26px;}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;}
.btn{
  padding:12px 22px;border-radius:10px;border:none;font-size:14.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;transition:.15s;
}
.btn-ochre{background:var(--ochre);color:var(--indigo-950);}
.btn-ochre:hover{background:#f2b358;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--cream);}
.btn-outline:hover{border-color:var(--ochre);color:var(--ochre);}
.btn-kente{background:var(--kente);color:var(--cream);}
.btn-kente:hover{background:var(--kente-dim);}
.btn-danger{background:transparent;border:1px solid var(--terracotta);color:var(--terracotta);}
.btn-danger:hover{background:var(--terracotta);color:var(--cream);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
select,input,textarea{
  background:var(--indigo-900);border:1px solid var(--line);color:var(--cream);
  padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;
}
select:focus,input:focus,textarea:focus{outline:1.5px solid var(--ochre);}
label{font-size:12.5px;color:var(--cream-dim);display:block;margin-bottom:6px;font-weight:500;}
.field{margin-bottom:14px;}

.pw-wrap{position:relative;}
.pw-wrap input{width:100%;padding-right:42px;}
.pw-eye{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;color:var(--cream-dim);
  width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.pw-eye:hover{color:var(--ochre);background:var(--indigo-800);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}
.card{
  background:var(--indigo-900);border:1px solid var(--line);border-radius:14px;
  padding:20px;transition:.15s;
}
.card:hover{border-color:var(--ochre-dim);transform:translateY(-2px);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.avatar{
  width:44px;height:44px;border-radius:50%;background:var(--indigo-800);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ochre);font-family:'Fraunces',serif;
}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.3px;}
.badge-sector{background:rgba(232,163,61,0.15);color:var(--ochre);}
.badge-active{background:rgba(60,122,93,0.18);color:var(--kente);}
.badge-suspended{background:rgba(193,80,46,0.18);color:var(--terracotta);}
.badge-pending{background:rgba(203,196,179,0.15);color:var(--cream-dim);}
.card h3{margin:2px 0 2px;font-size:17px;}
.meta{font-size:12.5px;color:var(--cream-dim);margin-bottom:10px;}
.stars{color:var(--ochre);font-size:13px;margin-bottom:10px;}
.contact-line{
  display:flex;align-items:center;gap:8px;background:var(--indigo-950);
  border:1px dashed var(--line);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:6px;
}
.blur-phone{filter:blur(4px);letter-spacing:1px;}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 18px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:24px;margin:0;font-weight:600;}
.section-head p{color:var(--cream-dim);font-size:13.5px;margin:4px 0 0;}

.modal-bg{
  position:fixed;inset:0;background:rgba(20,27,48,0.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal{
  background:var(--indigo-900);border:1px solid var(--line);border-radius:16px;
  padding:28px;max-width:460px;width:100%;max-height:88vh;overflow:auto;
}
.modal h2{margin:0 0 4px;font-size:21px;}
.modal .sub{color:var(--cream-dim);font-size:13.5px;margin-bottom:20px;}
.close-x{float:right;background:transparent;border:none;color:var(--cream-dim);font-size:20px;}

.paymethods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.paymethod{
  border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-size:13px;font-weight:600;
}
.paymethod.sel{border-color:var(--ochre);background:rgba(232,163,61,0.1);color:var(--ochre);}

.price-tag{font-family:'IBM Plex Mono',monospace;font-size:26px;color:var(--ochre);font-weight:600;margin:8px 0 2px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--cream-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:1px solid var(--line);}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,0.02);}
.table-wrap{background:var(--indigo-900);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:6px;overflow-x:auto;}

.statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:34px;}
.statcard{background:var(--indigo-900);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.statcard .n{font-family:'IBM Plex Mono',monospace;font-size:28px;color:var(--ochre);font-weight:600;}
.statcard .l{font-size:12.5px;color:var(--cream-dim);margin-top:4px;}

.barlist{display:flex;flex-direction:column;gap:10px;}
.barrow{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;font-size:13px;}
.bartrack{background:var(--indigo-950);border-radius:6px;height:10px;overflow:hidden;}
.barfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ochre),var(--terracotta));}
.chart-box{position:relative;height:260px;margin-top:10px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:6px;}
.kpi{background:var(--indigo-950);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.kpi .n{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--ochre);font-weight:600;}
.kpi .l{font-size:11.5px;color:var(--cream-dim);margin-top:3px;}
.kpi .d{font-size:11px;margin-top:4px;font-weight:600;}
.kpi .d.up{color:var(--kente);}
.kpi .d.down{color:var(--terracotta);}
.star-select{display:flex;gap:6px;font-size:30px;margin:10px 0 4px;cursor:pointer;}
.star-select span{color:var(--line);transition:.1s;}
.star-select span.on{color:var(--ochre);}
.review-item{border-bottom:1px solid var(--line);padding:12px 0;font-size:13.5px;}
.review-item:last-child{border-bottom:none;}
.review-item .rh{display:flex;justify-content:space-between;color:var(--cream-dim);font-size:12px;margin-bottom:4px;}

.two-col{display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;}
@media(max-width:820px){.two-col{grid-template-columns:1fr;}}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.settings-grid{grid-template-columns:1fr;}}
.panel{background:var(--indigo-900);border:1px solid var(--line);border-radius:14px;padding:22px;}
.panel h3{margin:0 0 4px;font-size:16px;}
.panel .sub{color:var(--cream-dim);font-size:12.5px;margin-bottom:16px;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--kente);color:var(--cream);
  padding:13px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.pill{font-size:11.5px;padding:4px 10px;border-radius:20px;background:var(--indigo-950);border:1px solid var(--line);color:var(--cream-dim);}

.footer-note{color:var(--cream-dim);font-size:12px;text-align:center;margin-top:60px;line-height:1.7;}
.empty{color:var(--cream-dim);font-size:14px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px;}
</style>
</head>

</footer>

function getCoords(country, city){
  const exact = CITY_COORDS[city+"|"+country];
  if(exact) return exact;
  const fallbackCity = CITIES[country] && CITIES[country][0];
  if(fallbackCity) return CITY_COORDS[fallbackCity+"|"+country] || ["",""];
  return ["",""];
}

async function cloudLoadAll(){
  if(!cloudReady) return false;
  try{
    const [artisansRes, txRes, reviewsRes, settingsRes] = await Promise.all([
      sb.from("artisans").select("*").order("joined",{ascending:false}),
      sb.from("transactions").select("*").order("date",{ascending:false}),
      sb.from("reviews").select("*").order("date",{ascending:false}),
      sb.from("admin_settings").select("*").eq("id",1).maybeSingle()
    ]);
    if(artisansRes.error) throw artisansRes.error;
    state.artisans = (artisansRes.data||[]).map(mapArtisanFromDb);
    state.transactions = (txRes.data||[]).map(mapTxFromDb);
    state.reviews = (reviewsRes.data||[]).map(mapReviewFromDb);
    if(settingsRes.data){
      state.admin = { username:settingsRes.data.admin_username, password:settingsRes.data.admin_password };
      state.settings = { unlockPrice:settingsRes.data.unlock_price, currency:settingsRes.data.currency, numbers:settingsRes.data.numbers };
    }
    return true;
  }catch(e){
    console.error("Supabase load error:", e);
    return false;
  }
}

function seedTransactions(artisans){
  const list=[];
  const methods=["Orange Money","MTN Mobile Money","Moov Money","Wave","Carte bancaire"];
  const pool=artisans.filter(a=>a.status==="actif");
  const now=new Date();
  for(let i=0;i<22;i++){
    const a=rand(pool);
    if(!a) continue;
    const daysAgo=Math.floor(Math.random()*14);
    const d=new Date(now.getTime()-daysAgo*86400000);
    list.push({
      id:"T"+(9000000+i),
      artisan:a.name, method:rand(methods),
      payerName:rand(FIRST_NAMES)+" "+rand(LAST_NAMES),
      payerAccount: rand(methods)==="Carte bancaire" ? "4000 •••• •••• "+(1000+i) : randPhone(),
      artisanSector:a.sector, artisanMetier:a.metier, artisanCountry:a.country, artisanCity:a.city,
      amount:2000, date:d.toISOString().slice(0,10)+" "+String(8+Math.floor(Math.random()*10)).padStart(2,"0")+":00"
    });
  }
  return list;
}

window.openReview=function(artisanId){
  const a=state.artisans.find(x=>x.id===artisanId);
  if(!a) return;
  state.modal={type:"review", artisan:a, rating:0};
  renderModal();
};
window.setReviewRating=function(n){ state.modal.rating=n; renderModal(); };
window.submitReview=function(){
  const m=state.modal;
  const a=m.artisan;
  if(!m.rating) return;
  const comment=document.getElementById("review-comment").value.trim();
  const lastTx=state.transactions.slice().reverse().find(t=>t.artisan===a.name);
  const review={
    id:"R"+Date.now(), artisanId:a.id, artisanName:a.name,
    rating:m.rating, comment, payerName:(lastTx&&lastTx.payerName)||"Client",
    date:new Date().toISOString().slice(0,10)
  };
  state.reviews.unshift(review);
  const prevAvg=parseFloat(a.rating)||0;
  const prevCount=a.reviews||0;
  a.rating=((prevAvg*prevCount + m.rating)/(prevCount+1)).toFixed(1);
  a.reviews=prevCount+1;
  cloudInsertReview(review);
  cloudUpdateArtisan(a);
  toast("Merci pour votre avis !");
  closeModal();
  render();
};

window.selectMethod=function(name){ state.modal.method=name; renderModal(); };
window.goToInfo=function(){ state.modal.step="info"; renderModal(); };
window.goToPay=function(){
  const name=document.getElementById("pay-name").value.trim();
  const account=document.getElementById("pay-account").value.trim();
  if(!name||!account){ toast("Merci de renseigner votre nom et votre numéro/carte."); return; }
  state.modal.payerName=name;
  state.modal.payerAccount=account;
  state.modal.step="pay";
  renderModal();
};
window.confirmPay=function(){
  const a=state.modal.artisan;
  state.unlockedIds.add(a.id);
  const tx={
    id:"T"+Date.now(), artisan:a.name, method:state.modal.method,
    payerName:state.modal.payerName, payerAccount:state.modal.payerAccount,
    artisanSector:a.sector, artisanMetier:a.metier, artisanCountry:a.country, artisanCity:a.city,
    amount:state.settings.unlockPrice, date:new Date().toISOString().slice(0,16).replace("T"," ")
  };
  state.transactions.push(tx);
  cloudInsertTx(tx);
  state.modal.step="done";
  renderModal();
  render();
};
window.closeModal=function(){ state.modal=null; renderModal(); };
window.closeModalBg=function(e){ if(e.target.classList.contains("modal-bg")) closeModal(); };

/* ============================ EXPORT CSV / EXCEL ============================ */

function downloadBlob(content, filename, mime){
  const blob=new Blob([content], {type:mime});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url; link.download=filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function toCSV(headers, rows){
  const esc = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[headers.map(esc).join(";")];
  rows.forEach(r=>lines.push(r.map(esc).join(";")));
  return "\uFEFF" + lines.join("\r\n"); // BOM pour Excel/accents
}

function exportCSV(headers, rows, filename){
  downloadBlob(toCSV(headers, rows), filename, "text/csv;charset=utf-8;");
  toast("Export CSV téléchargé.");
}

function exportXLSX(headers, rows, filename, sheetName){
  if(typeof XLSX==="undefined"){ toast("La librairie Excel n'a pas pu se charger (connexion réseau)."); return; }
  const data=[headers, ...rows];
  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName||"Données");
  XLSX.writeFile(wb, filename);
  toast("Export Excel téléchargé.");
}

function artisansRows(){
  return state.artisans.map(a=>{
    const [lat,lng]=getCoords(a.country,a.city);
    return [a.sector, a.country, a.city, a.name, countryPrefix(a.country)+" "+a.phone, a.metier, a.bio, lat, lng, a.rating, a.reviews, a.status];
  });
}
const ARTISANS_HEADERS=["Secteur","Pays","Ville","Nom","Téléphone","Métier précis","Présentation courte","Latitude","Longitude","Note","Avis","Statut"];

window.exportArtisansCSV=function(){ exportCSV(ARTISANS_HEADERS, artisansRows(), "artisanrescue-artisans.csv"); };
window.exportArtisansXLSX=function(){ exportXLSX(ARTISANS_HEADERS, artisansRows(), "artisanrescue-artisans.xlsx", "Artisans"); };

function clientsRows(){
  return state.transactions.map(t=>{
    const [lat,lng]=getCoords(t.artisanCountry,t.artisanCity);
    return [t.payerName, t.method, t.payerAccount, t.artisan, t.artisanCountry, t.artisanCity, lat, lng, t.artisanSector, t.artisanMetier, t.amount, t.date];
  });
}
const CLIENTS_HEADERS=["Nom client","Moyen de paiement","Numéro de paiement","Artisan sollicité","Pays","Ville","Latitude","Longitude","Secteur","Métier","Montant","Date"];

window.exportClientsCSV=function(){ exportCSV(CLIENTS_HEADERS, clientsRows(), "artisanrescue-clients-marketplace.csv"); };
window.exportClientsXLSX=function(){ exportXLSX(CLIENTS_HEADERS, clientsRows(), "artisanrescue-clients-marketplace.xlsx", "Clients marketplace"); };

window.exportFullDatabaseXLSX=function(){
  if(typeof XLSX==="undefined"){ toast("La librairie Excel n'a pas pu se charger (connexion réseau)."); return; }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([ARTISANS_HEADERS, ...artisansRows()]), "Artisans");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([CLIENTS_HEADERS, ...clientsRows()]), "Clients marketplace");
  const villesHeaders=["Ville","Pays","Latitude","Longitude","Nb artisans"];
  const villesMap={};
  state.artisans.forEach(a=>{ const k=a.city+"|"+a.country; villesMap[k]=(villesMap[k]||0)+1; });
  const villesRows=Object.keys(villesMap).map(k=>{
    const [city,country]=k.split("|"); const [lat,lng]=getCoords(country,city);
    return [city,country,lat,lng,villesMap[k]];
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([villesHeaders, ...villesRows]), "Villes");
  XLSX.writeFile(wb, "artisanrescue-base-complete.xlsx");
  toast("Base complète téléchargée (3 onglets, prête pour TCD).");
};

window.adminLogout=function(){

function renderAdminTab(){
  if(adminTab==="overview") return adminOverview();
  if(adminTab==="analytics") return adminAnalytics();

function adminAnalytics(){
  const revenue = state.transactions.reduce((s,t)=>s+t.amount,0);
  const nbTx = state.transactions.length;
  const avgTicket = nbTx ? Math.round(revenue/nbTx) : 0;
  const activeArtisans = state.artisans.filter(a=>a.status==="actif").length;
  const conversionPerArtisan = activeArtisans ? (nbTx/activeArtisans).toFixed(2) : "0";
  const avgRating = state.artisans.length ? (state.artisans.reduce((s,a)=>s+parseFloat(a.rating||0),0)/state.artisans.length).toFixed(2) : "0";

  return `
  <div class="kpi-row">
    <div class="kpi"><div class="n mono">${revenue.toLocaleString()} ${state.settings.currency}</div><div class="l">Revenu total simulé</div></div>
    <div class="kpi"><div class="n mono">${avgTicket.toLocaleString()} ${state.settings.currency}</div><div class="l">Panier moyen par déverrouillage</div></div>
    <div class="kpi"><div class="n mono">${conversionPerArtisan}</div><div class="l">Déverrouillages par artisan actif</div></div>
    <div class="kpi"><div class="n mono">★ ${avgRating}</div><div class="l">Note moyenne de la plateforme</div></div>
  </div>

  <div class="two-col" style="margin-top:20px;">
    <div class="panel">
      <h3>Revenu dans le temps</h3>
      <div class="sub">Somme des déverrouillages payés, par jour</div>
      <div class="chart-box"><canvas id="chart-revenue"></canvas></div>
    </div>
    <div class="panel">
      <h3>Répartition des comptes</h3>
      <div class="sub">Artisans actifs vs suspendus</div>
      <div class="chart-box"><canvas id="chart-status"></canvas></div>
    </div>
  </div>

  <div class="two-col" style="margin-top:20px;">
    <div class="panel">
      <h3>Revenu par secteur</h3>
      <div class="sub">Quels métiers génèrent le plus de mises en relation payées</div>
      <div class="chart-box"><canvas id="chart-revenue-sector"></canvas></div>
    </div>
    <div class="panel">
      <h3>Revenu par pays</h3>
      <div class="sub">Répartition géographique du chiffre d'affaires</div>
      <div class="chart-box"><canvas id="chart-revenue-country"></canvas></div>
    </div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h3>Top 5 des artisans les plus sollicités</h3>
    <div class="sub">Classement par nombre de contacts déverrouillés par des clients</div>
    <div class="chart-box" style="height:220px;"><canvas id="chart-top-artisans"></canvas></div>
  </div>

}

function initAnalyticsCharts(){
  if(typeof Chart==="undefined"){ return; }
  const gridColor="rgba(245,239,227,0.08)";
  const textColor="#cfc6b3";
  Chart.defaults.color=textColor;
  Chart.defaults.font.family="Inter";

  // --- Revenu dans le temps (par jour) ---
  const byDay={};
  state.transactions.forEach(t=>{ const d=t.date.slice(0,10); byDay[d]=(byDay[d]||0)+t.amount; });
  const days=Object.keys(byDay).sort();
  new Chart(document.getElementById("chart-revenue"), {
    type:"line",
    data:{ labels:days, datasets:[{ label:"Revenu ("+state.settings.currency+")", data:days.map(d=>byDay[d]),
      borderColor:"#e8a33d", backgroundColor:"rgba(232,163,61,0.15)", fill:true, tension:0.3 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ x:{grid:{color:gridColor}}, y:{grid:{color:gridColor}, beginAtZero:true} },
      plugins:{ legend:{display:false} } }
  });

  // --- Statut des comptes (donut) ---
  const statusCounts=groupCount(state.artisans,"status");
  new Chart(document.getElementById("chart-status"), {
    type:"doughnut",
    data:{ labels:statusCounts.map(s=>s[0]), datasets:[{ data:statusCounts.map(s=>s[1]),
      backgroundColor:["#3c7a5d","#c1502e","#324a7d"] }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:"bottom"} } }
  });

  // --- Revenu par secteur ---
  const bySector={};
  state.transactions.forEach(t=>{ bySector[t.artisanSector]=(bySector[t.artisanSector]||0)+t.amount; });
  const sectorLabels=Object.keys(bySector).sort((a,b)=>bySector[b]-bySector[a]);
  new Chart(document.getElementById("chart-revenue-sector"), {
    type:"bar",
    data:{ labels:sectorLabels, datasets:[{ label:"Revenu", data:sectorLabels.map(s=>bySector[s]), backgroundColor:"#c1502e" }]},
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:"y",
      scales:{ x:{grid:{color:gridColor}, beginAtZero:true}, y:{grid:{display:false}} },
      plugins:{ legend:{display:false} } }
  });

  // --- Revenu par pays ---
  const byCountry={};
  state.transactions.forEach(t=>{ byCountry[t.artisanCountry]=(byCountry[t.artisanCountry]||0)+t.amount; });
  const countryLabels=Object.keys(byCountry).sort((a,b)=>byCountry[b]-byCountry[a]);
  new Chart(document.getElementById("chart-revenue-country"), {
    type:"bar",
    data:{ labels:countryLabels, datasets:[{ label:"Revenu", data:countryLabels.map(c=>byCountry[c]), backgroundColor:"#e8a33d" }]},
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:"y",
      scales:{ x:{grid:{color:gridColor}, beginAtZero:true}, y:{grid:{display:false}} },
      plugins:{ legend:{display:false} } }
  });

  // --- Top 5 artisans sollicités ---
  const byArtisan={};
  state.transactions.forEach(t=>{ byArtisan[t.artisan]=(byArtisan[t.artisan]||0)+1; });
  const topArtisans=Object.entries(byArtisan).sort((a,b)=>b[1]-a[1]).slice(0,5);
  new Chart(document.getElementById("chart-top-artisans"), {
    type:"bar",
    data:{ labels:topArtisans.map(x=>x[0]), datasets:[{ label:"Déverrouillages", data:topArtisans.map(x=>x[1]), backgroundColor:"#3c7a5d" }]},
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:"y",
      scales:{ x:{grid:{color:gridColor}, beginAtZero:true, ticks:{precision:0}}, y:{grid:{display:false}} },
      plugins:{ legend:{display:false} } }
  });
}

function groupCount(list,key){
  const m={};
  list.forEach(x=>{ m[x[key]]=(m[x[key]]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function barList(pairs){
  const max=Math.max(...pairs.map(p=>p[1]),1);
  return `<div class="barlist">${pairs.map(([label,count])=>`
    <div class="barrow">
      <div>${label}</div>
      <div class="bartrack"><div class="barfill" style="width:${(count/max*100).toFixed(0)}%"></div></div>
      <div class="mono" style="text-align:right;">${count}</div>
    </div>`).join("")}</div>`;
}

function adminStats(){
  const byCountry=groupCount(state.artisans,"country");
  const bySector=groupCount(state.artisans,"sector");
  const byStatus=groupCount(state.artisans,"status");
  return `
  <div class="two-col">
    <div class="panel"><h3>Artisans par pays</h3><div class="sub">Répartition des inscriptions</div>${barList(byCountry)}</div>
    <div class="panel"><h3>Artisans par secteur</h3><div class="sub">Répartition des métiers</div>${barList(bySector)}</div>
  </div>

    <h3>Répartition par statut de compte</h3><div class="sub">Actifs vs suspendus</div>${barList(byStatus)}
  </div>`;
}

function adminMap(){
  const allByCountry={};
  state.artisans.forEach(a=>{
    allByCountry[a.country]=allByCountry[a.country]||{artisans:0,cities:new Set()};
    allByCountry[a.country].artisans++; allByCountry[a.country].cities.add(a.city);
  });
  const rows=Object.entries(allByCountry).sort((a,b)=>b[1].artisans-a[1].artisans);
  const cityRows=[];
  state.artisans.forEach(a=>{ cityRows.push(a.city+"|"+a.country); });
  const uniqueCities=[...new Set(cityRows)].map(k=>{
    const [city,country]=k.split("|");
    const [lat,lng]=getCoords(country,city);
    const count=state.artisans.filter(a=>a.city===city&&a.country===country).length;
    return {city,country,lat,lng,count};
  }).sort((a,b)=>b.count-a.count);
  return `
  <div class="panel">
    <h3>Cartographie des lieux d'enregistrement — par pays</h3>
    <div class="sub">Vue tabulaire par pays et ville — pour une carte géographique interactive (pins sur le globe), il faudra brancher une API cartographique (Google Maps / Mapbox) côté serveur.</div>
    <div class="table-wrap"><table>
      <tr><th>Pays</th><th>Villes actives</th><th>Artisans inscrits</th></tr>
      ${rows.map(([country,d])=>`<tr>
        <td>${country} <span class="mono" style="color:var(--cream-dim)">${countryPrefix(country)}</span></td>
        <td>${[...d.cities].join(", ")}</td>
        <td class="mono">${d.artisans}</td>
      </tr>`).join("")}
    </table></div>
  </div>
  <div class="panel" style="margin-top:20px;">
    <h3>Coordonnées géographiques par ville d'enregistrement</h3>
    <div class="sub">Latitude / longitude approximatives, exploitables dans un outil cartographique externe (Google Maps, Mapbox, Excel Cartes).</div>
    <div class="table-wrap"><table>
      <tr><th>Ville</th><th>Pays</th><th>Latitude</th><th>Longitude</th><th>Artisans</th></tr>
      ${uniqueCities.map(r=>`<tr>
        <td>${r.city}</td><td>${r.country}</td>
        <td class="mono">${r.lat}</td><td class="mono">${r.lng}</td>
        <td class="mono">${r.count}</td>
      </tr>`).join("")}
    </table></div>
  </div>`;
}

window.toggleArtisanStatus=function(id){
  const a=state.artisans.find(x=>x.id===id);
  a.status = a.status==="actif" ? "suspendu" : "actif";
  cloudUpdateArtisan(a);
  toast(a.status==="actif" ? "Artisan réactivé." : "Artisan suspendu.");
  render();
};
window.deleteArtisan=function(id){
  state.artisans=state.artisans.filter(x=>x.id!==id);
  cloudDeleteArtisan(id);
  toast("Compte artisan supprimé.");
  render();
};

  return `

      ` : `
        <div class="sub" style="color:var(--terracotta);">⚠ Mode démo local — non sécurisé. Connectez Supabase pour une vraie authentification.</div>

          <div class="pw-wrap"><input id="set-pass" type="password" placeholder="Laisser vide pour ne pas changer">
            <button type="button" class="pw-eye" onclick="togglePwd('set-pass',this)">👁</button></div>
        </div>
        <button class="btn btn-ochre" onclick="saveAdminCreds()">Mettre à jour</button>
      `}

    <div class="panel">

      <div class="sub">Liste des pays utilisables à l'inscription (extensible à l'international).</div>
      <div class="pill-row">
        ${COUNTRIES.map(c=>`<span class="pill">${c.name} · ${c.prefix}</span>`).join("")}
      </div>

function cssId(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-');}

window.saveUnlockPrice=function(){
  state.settings.unlockPrice=Number(document.getElementById("set-price").value)||state.settings.unlockPrice;
  state.settings.currency=document.getElementById("set-currency").value||state.settings.currency;
  saveAdminConfig();
  cloudSaveSettings();
  toast("Prix de déverrouillage mis à jour.");
  render();
};
window.saveNumbers=function(){
  Object.keys(state.settings.numbers).forEach(name=>{
    const el=document.getElementById("num-"+cssId(name));
    if(el) state.settings.numbers[name]=el.value;
  });
  saveAdminConfig();
  cloudSaveSettings();
  toast("Numéros de paiement mis à jour.");
  render();
};
window.saveAdminCreds=async function(){
  const p=document.getElementById("set-pass").value.trim();
  if(cloudReady){
    if(!p){ toast("Saisissez un nouveau mot de passe."); return; }
    const {error} = await sb.auth.updateUser({ password:p });
    if(error){ toast("Erreur : "+error.message); return; }
    toast("Mot de passe mis à jour.");
    document.getElementById("set-pass").value="";
    return;
  }
  // Mode démo local uniquement
  const u=document.getElementById("set-user").value.trim();
  if(u) state.admin.username=u;
  if(p) state.admin.password=p;
  saveAdminConfig();
  toast("Identifiants administrateur mis à jour (mode démo local).");
  render();
};

/* ============================ HANDLERS FILTRES HOME ============================ */

let searchCursorPos=null;
function attachHandlers(){
  const fs=document.getElementById("f-sector");
  const fc=document.getElementById("f-country");
  const fq=document.getElementById("f-search");
  if(fs) fs.onchange=()=>{ state.filterSector=fs.value; render(); };
  if(fc) fc.onchange=()=>{ state.filterCountry=fc.value; render(); };
  if(fq){
    fq.oninput=()=>{ state.searchQuery=fq.value; searchCursorPos=fq.selectionStart; render(); };
    if(searchCursorPos!==null){ fq.focus(); fq.setSelectionRange(searchCursorPos, searchCursorPos); }
  }
  if(document.getElementById("ar-sector")) refreshMetiers();
  if(document.getElementById("db-sector")) refreshDbMetiers();
  if(state.view==="admin-dashboard" && adminTab==="analytics") initAnalyticsCharts();
}

/* ============================ INIT ============================ */
render(); // premier affichage immédiat avec les données locales/démo

(async function initCloud(){
  if(cloudReady){
    const ok = await cloudLoadAll();
    if(ok){ toast("Connecté à la base de données en ligne."); }
    else { cloudReady=false; toast("⚠ Base de données injoignable — mode démo local activé."); }
    if(cloudReady){
      const { data:{ session } } = await sb.auth.getSession();
      if(session){ state.adminAuthed=true; currentAdminEmail=session.user.email; }
    }
    render();
  }
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// Bouton "Installer l'application" (Android / Chrome desktop)
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const btn=document.getElementById("install-app-btn");
  if(btn) btn.style.display="inline-flex";
});
window.installApp=function(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{
    deferredInstallPrompt=null;
    const btn=document.getElementById("install-app-btn");
    if(btn) btn.style.display="none";
  });
};
